name: Deploy

# Production deploy to the Hetzner server (docs/DEPLOY.md, step 7).
# Runs after CI succeeds on main, or by hand (Actions → Deploy → Run workflow). A manual run
# with a `tag` skips the build and redeploys that existing image tag (e.g. to roll back).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag (git SHA) to deploy instead of building this commit
        required: false
        default: ''

# Never two deploys at once; a newer one waits instead of cancelling one mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # The commit CI tested (workflow_run), or the commit this manual run started from.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  SITE_URL: ${{ vars.SITE_URL || 'https://avenir.academy' }}
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api.avenir.academy/api/v1/health' }}

jobs:
  build:
    name: Build ${{ matrix.app }} image(s)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Image names
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/avenir" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push avenir-${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-${{ matrix.app }}:${{ env.SHA }}
            ${{ steps.image.outputs.prefix }}-${{ matrix.app }}:latest
          # Baked into the web bundle at build time (the api image has no such args).
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.avenir.academy/api/v1' }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      # The api image plus the Prisma CLI; reuses every layer built just above.
      - name: Build and push avenir-migrate
        if: matrix.app == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-migrate:${{ env.SHA }}
            ${{ steps.image.outputs.prefix }}-migrate:latest
          cache-from: type=gha,scope=api

  deploy:
    name: Deploy to the server
    needs: build
    # Also runs when `build` was skipped because a tag was given.
    if: >-
      always() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the server's host key when DEPLOY_KNOWN_HOSTS is set (recommended).
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n' > ~/.ssh/config

      - name: Copy deploy/ to the server
        # .env.production, the recorded image tags and local backups stay as they are.
        run: >-
          rsync -az --delete
          --exclude .env.production --exclude '.image-tag*' --exclude backups/
          deploy/ "$TARGET:/opt/avenir/deploy/"

      - name: Pull, migrate, start (rolls back by itself if health checks fail)
        run: ssh "$TARGET" "/opt/avenir/deploy/scripts/deploy.sh '$TAG'"

      - name: Check the public URLs
        id: public
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$API_HEALTH_URL" && curl -fsS --max-time 10 -o /dev/null "$SITE_URL/"; then
              echo; echo "OK: $API_HEALTH_URL and $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public health checks failed"
          exit 1

      - name: Roll back to the previous tag
        if: failure() && steps.public.outcome == 'failure'
        run: ssh "$TARGET" "/opt/avenir/deploy/scripts/rollback.sh"
