# Production stack for one server (docs/DEPLOY.md). Run from this folder:
#   docker compose up -d --build
# Only Caddy is reachable from outside (ports 80/443); everything else is on the private network.

name: ai-academy

# Every image builds from the same `build` stage, so give all of them the same build args
# (the stage then runs once and is shared).
x-build: &build
  context: ..
  args:
    SITE_URL: https://${DOMAIN}
    API_INTERNAL_URL: http://api:4000/api/v1
    NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_academy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # Applies database migrations, then exits. The API waits for it.
  migrate:
    build: { <<: *build, target: migrate }
    environment:
      DATABASE_URL: &database-url postgresql://${POSTGRES_USER:-academy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_academy}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    build: { <<: *build, target: api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
      WEB_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      # Requests reach the API through Caddy and the web container (private Docker
      # addresses); trusting those makes rate limits see the real client IP (PLAN D3).
      TRUST_PROXY: loopback, uniquelocal
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  web:
    build: { <<: *build, target: web }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
      SITE_URL: https://${DOMAIN}
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    logging: *logging

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
