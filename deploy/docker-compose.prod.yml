# Production stack for one DigitalOcean Droplet (docs/DEPLOY.md). Run it through the wrapper,
# which passes the env file and the image tag:
#   deploy/scripts/compose.sh up -d
# Equivalent: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Only Caddy publishes ports (80/443). Postgres sits on an internal network with no route to
# the internet and no published port.

name: avenir

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

# Images come from GitHub Container Registry (avenir-web, avenir-api, avenir-migrate); IMAGE_TAG
# (a git SHA) is written to deploy/.image-tag by deploy.sh / rollback.sh.

x-database-url: &database-url postgresql://${POSTGRES_USER:-avenir}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-avenir}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avenir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-avenir}
    # Sized for the 1 GB memory limit below.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=640MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

  # One-off: applies pending migrations (`prisma migrate deploy`, never `migrate dev` or
  # `reset`), then exits. The API starts only after it succeeded.
  migrate:
    # The api image plus the Prisma CLI (apps/api/Dockerfile, target `migrate`).
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY in .env.production}/avenir-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: 'no'
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging

  api:
    image: ${IMAGE_REGISTRY}/avenir-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: *database-url
      NODE_OPTIONS: --max-old-space-size=512
      # Requests arrive from Caddy (and the web container's /api/v1 rewrite) on private Docker
      # addresses; trusting them makes rate limits see the real client IP (PLAN D3).
      TRUST_PROXY: loopback, uniquelocal
      # Only used with STORAGE_DRIVER=local (temporary mode, before R2): materials go to the
      # uploads-data volume, so they survive redeploys.
      UPLOAD_DIR: /data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - uploads-data:/data/uploads
    # backend: the database; edge: Caddy, plus outbound access to R2 and Resend.
    networks: [backend, edge]
    deploy:
      resources:
        limits: { memory: 768m }
    logging: *logging

  web:
    image: ${IMAGE_REGISTRY}/avenir-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      # Server components fetch the API over the private network.
      API_INTERNAL_URL: http://api:4000/api/v1
      SITE_URL: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env.production}
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    deploy:
      resources:
        limits: { memory: 768m }
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [edge]
    deploy:
      resources:
        limits: { memory: 256m }
    logging: *logging

  # Nightly pg_dump to a private R2 bucket (deploy/backup/). Built on the server by deploy.sh.
  backup:
    build: ./backup
    image: avenir-backup:local
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-avenir}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-avenir}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, edge]
    deploy:
      resources:
        limits: { memory: 256m }
    logging: *logging

networks:
  # No internet access: only the services that need the database join it.
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  uploads-data:
